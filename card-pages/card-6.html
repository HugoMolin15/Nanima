<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Nanima</title>
    <link rel="preload" href="../fonts/Aptos-Light.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.cdnfonts.com/css/zapfino" rel="stylesheet">
    <link rel="icon" href="../images/logo-small.png" type="image/png">
</head>
<body>

    <!-- Header -->
    <div class="section">
        <div class="header">
            <a href='/'>
                <img src="../images/logo-small.png" alt="logo">
            </a>
            <div>
                <!--<a href="Contact" data-i18n="header_contact">Contact</a>-->
                <div class="select-wrapper">
                    <select id="langSelect" class="button">
                        <option value="en">EN</option>
                        <option value="it">IT</option>
                        <option value="nl">NL</option>
                        <option value="sv">SV</option>
                    </select>
                </div>
            </div> 
        </div>
    </div>

    <!-- Big Card Style Header -->
    <div class="bg-section card-header" style="background-image:
        linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 100%),
        url('../images/stories/6.webp');">
        
        <h2 class="card-title-large" data-i18n="card_6">Our Olive Grove</h2>
    </div>

    <!-- Card Content Text -->
    <div class="card-content section">
        <div class="card-text-container">
            <p data-i18n="card_6_text">
                Store Nanima’s Extra Virgin Olive Oil in a cool, dark place, ideally at 14–18 °C.
Sheltered from light, heat, and air, it preserves its purity, flavor, and natural vitality for up to 18 months after opening.


            </p>
        </div>
    </div>

    

    <script src="../translations.js"></script>

    <script>
        const supportedLangs = ["en", "it", "nl", "sv"];
        let currentLang = localStorage.getItem("lang") || "en";

        function applyLanguage(lang) {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                el.innerHTML = translations[lang][key];
            });

            // Set the dropdown to the current language
            const select = document.getElementById("langSelect");
            if(select) select.value = lang;

            localStorage.setItem("lang", lang);
        }

        // Load initial language
        applyLanguage(currentLang);

        // Change language when dropdown value changes
        document.getElementById("langSelect").addEventListener("change", (e) => {
            currentLang = e.target.value;
            applyLanguage(currentLang);
        });

    </script>

</body>
</html>
