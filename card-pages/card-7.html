<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Nanima</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" href="Images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <div class="section">
        <div class="header">
            <a href='/'>
                <img src="../Images/logo.png" alt="logo">
            </a>
            <div>
                <!--<a href="Contact" data-i18n="header_contact">Contact</a>-->
                <div class="select-wrapper">
                    <select id="langSelect" class="button">
                        <option value="en">EN</option>
                        <option value="it">IT</option>
                        <option value="nl">NL</option>
                        <option value="sv">SV</option>
                    </select>
                </div>
            </div> 
        </div>
    </div>

    <!-- Big Card Style Header -->
    <div class="bg-section card-header" style="background-image:
        linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 100%),
        url('../Images/7.jpeg');">
        
        <h2 class="card-title-large" data-i18n="card_7">Our Olive Grove</h2>
    </div>

    <!-- Card Content Text -->
    <div class="card-content section">
        <div class="card-text-container">
            <p data-i18n="card_7_text">
                Caring for our olive grove is a craft that requires both patience and love. It’s a rhythmic work—a dialogue between humans and nature—where every gesture is part of the olive oil’s journey.

            </p>
        </div>
    </div>

    

    <script src="../translations.js"></script>

    <script>
        const supportedLangs = ["en", "it", "nl", "sv"];
        let currentLang = localStorage.getItem("lang") || "en";

        function applyLanguage(lang) {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                el.innerHTML = translations[lang][key];
            });

            // Set the dropdown to the current language
            const select = document.getElementById("langSelect");
            if(select) select.value = lang;

            localStorage.setItem("lang", lang);
        }

        // Load initial language
        applyLanguage(currentLang);

        // Change language when dropdown value changes
        document.getElementById("langSelect").addEventListener("change", (e) => {
            currentLang = e.target.value;
            applyLanguage(currentLang);
        });

    </script>

</body>
</html>
